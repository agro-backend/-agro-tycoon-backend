<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agro-Tycoon</title>
  <!-- SDK oficial de Telegram Mini Apps -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      text-align: center;
      padding: 20px;
      color: #333;
    }
    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 0 auto;
    }
    button {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🌾 Agro-Tycoon ☕</h1>
    <p id="user-greeting">Cargando datos del agricultor...</p>
    <button onclick="plantar()">Sembrar Cultivo 🚜</button>
  </div>

  <script>
    // Inicializar el SDK de Telegram
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Expande la app a pantalla completa en Telegram

    // Obtener información del usuario
    const user = tg.initDataUnsafe?.user;
    const greeting = document.getElementById('user-greeting');

    if (user) {
      greeting.innerText = `¡Bienvenido, ${user.first_name}! Preparado para gestionar tu finca.`;
    } else {
      greeting.innerText = '¡Bienvenido a Agro-Tycoon!';
    }

    function plantar() {
      tg.showAlert('¡Has sembrado una nueva parcela!');
    }
  </script>
</body>
</html>
